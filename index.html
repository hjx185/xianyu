<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闲鱼 - 淘好物，上闲鱼</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🐟</span>
                <span>闲鱼</span>
            </a>
            <div class="search-box">
                <input type="text" placeholder="搜索你想要的宝贝">
                <button>🔍</button>
            </div>
            <div class="user-actions">
                <!-- 动态生成 -->
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="main">
        <!-- 轮播图区域 -->
        <section class="banner-section">
            <div class="banner-container">
                <div class="banner-slides">
                    <div class="banner-slide active" style="background-image: url('images/banners/banner1.svg'); background-size: cover; background-position: center;">
                        <div class="banner-content">
                            <h2>数码好物节</h2>
                            <p>海量数码好物，低价抢购</p>
                            <a href="search.html?category=1" class="btn btn-dark">立即查看</a>
                        </div>
                    </div>
                    <div class="banner-slide" style="background-image: url('images/banners/banner2.svg'); background-size: cover; background-position: center;">
                        <div class="banner-content">
                            <h2>夏日焕新</h2>
                            <p>服饰鞋包，焕新一夏</p>
                            <a href="search.html?category=4" class="btn btn-dark">立即查看</a>
                        </div>
                    </div>
                    <div class="banner-slide" style="background-image: url('images/banners/banner3.svg'); background-size: cover; background-position: center;">
                        <div class="banner-content">
                            <h2>开学季</h2>
                            <p>电脑办公，助力学习</p>
                            <a href="search.html?category=2" class="btn btn-dark">立即查看</a>
                        </div>
                    </div>
                </div>
                <button class="banner-prev">❮</button>
                <button class="banner-next">❯</button>
                <div class="banner-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </section>

        <!-- 分类导航 -->
        <section class="category-section">
            <div class="category-grid" id="categoryGrid">
                <!-- 动态生成 -->
            </div>
        </section>

        <!-- 筛选标签 -->
        <section class="filter-section">
            <div class="filter-tabs">
                <button class="filter-tab active" data-sort="recommend">推荐</button>
                <button class="filter-tab" data-sort="new">最新</button>
                <button class="filter-tab" data-sort="price_asc">价格↑</button>
                <button class="filter-tab" data-sort="price_desc">价格↓</button>
            </div>
        </section>

        <!-- 商品瀑布流 -->
        <section class="goods-section">
            <div class="waterfall-grid" id="goodsList">
                <!-- 动态生成 -->
            </div>
            <div class="load-more">
                <button class="btn btn-secondary" id="loadMoreBtn">加载更多</button>
            </div>
        </section>

        <!-- 学号姓名信息 -->
        <section class="student-info">
            <p>学号：24215220133 | 姓名：何嘉雄</p>
        </section>
    </main>

    <!-- 底部导航 - 移动端 -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">首页</span>
        </a>
        <a href="search.html" class="nav-item">
            <span class="nav-icon">🔍</span>
            <span class="nav-text">搜索</span>
        </a>
        <a href="publish.html" class="nav-item publish">
            <span class="nav-icon">+</span>
            <span class="nav-text">发布</span>
        </a>
        <a href="message.html" class="nav-item">
            <span class="nav-icon">💬</span>
            <span class="nav-text">消息</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-text">我的</span>
        </a>
    </nav>

    <!-- 页脚 -->
    <footer class="footer">
        <p>闲鱼购物平台 </p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
