<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 闲鱼</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🐟</span>
                <span>闲鱼</span>
            </a>
            <div class="search-box">
                <input type="text" placeholder="搜索你想要的宝贝">
                <button>🔍</button>
            </div>
            <div class="user-actions">
                <a href="login.html">登录</a>
                <a href="register.html">注册</a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">🐟</div>
                <h2>注册闲鱼</h2>
                <p>开始你的闲置交易之旅</p>
            </div>
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="用户名（4-16位字母数字）" required>
                    <div class="form-error" id="usernameError"></div>
                </div>
                <div class="form-group">
                    <input type="text" id="nickname" placeholder="昵称" required>
                    <div class="form-error" id="nicknameError"></div>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" placeholder="手机号" required>
                    <div class="form-error" id="phoneError"></div>
                </div>
                <div class="form-group">
                    <input type="text" id="location" placeholder="所在地区（如：广东广州）">
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="密码（至少6位）" required>
                    <div class="form-error" id="passwordError"></div>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="确认密码" required>
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>
            <div class="auth-footer">
                <p>已有账号？<a href="login.html">立即登录</a></p>
            </div>
            <div class="student-info">
                <p>学号：24215220133 | 姓名：何嘉雄</p>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
