<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="psBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#283593"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#psBg2)" rx="8"/>
  <!-- DualSense controller - front view -->
  <!-- Controller body -->
  <path d="M120 160 Q120 130 150 120 L250 120 Q280 130 280 160 L280 200 Q280 220 260 230 L240 235 Q230 240 225 250 L220 260 Q215 265 210 260 L200 240 L190 260 Q185 265 180 260 L175 250 Q170 240 160 235 L140 230 Q120 220 120 200 Z" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
  <!-- Center touchpad -->
  <rect x="170" y="140" width="60" height="40" rx="8" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <!-- Touchpad divider -->
  <line x1="200" y1="142" x2="200" y2="178" stroke="#ddd" stroke-width="0.5"/>
  <!-- D-pad (left) -->
  <rect x="138" y="155" width="20" height="6" rx="2" fill="#ddd"/>
  <rect x="145" y="148" width="6" height="20" rx="2" fill="#ddd"/>
  <!-- Face buttons (right) -->
  <circle cx="252" cy="152" r="5" fill="none" stroke="#ddd" stroke-width="1.5"/>
  <circle cx="264" cy="164" r="5" fill="none" stroke="#ddd" stroke-width="1.5"/>
  <circle cx="240" cy="164" r="5" fill="none" stroke="#ddd" stroke-width="1.5"/>
  <circle cx="252" cy="176" r="5" fill="none" stroke="#ddd" stroke-width="1.5"/>
  <!-- Button symbols -->
  <text x="252" y="155" font-family="Arial" font-size="5" fill="#999" text-anchor="middle">△</text>
  <text x="264" y="167" font-family="Arial" font-size="5" fill="#999" text-anchor="middle">○</text>
  <text x="240" y="167" font-family="Arial" font-size="5" fill="#999" text-anchor="middle">□</text>
  <text x="252" y="179" font-family="Arial" font-size="5" fill="#999" text-anchor="middle">×</text>
  <!-- L1/R1 bumpers -->
  <path d="M125 130 Q130 120 155 118" fill="none" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
  <path d="M275 130 Q270 120 245 118" fill="none" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
  <!-- PS button -->
  <circle cx="200" cy="195" r="6" fill="none" stroke="#ccc" stroke-width="1"/>
  <text x="200" y="198" font-family="Arial" font-size="6" fill="#999" text-anchor="middle">PS</text>
  <!-- Microphone button -->
  <rect x="185" y="205" width="8" height="8" rx="2" fill="#e0e0e0"/>
  <!-- Create/Options buttons -->
  <rect x="178" y="148" width="8" height="5" rx="2" fill="#e0e0e0"/>
  <rect x="214" y="148" width="8" height="5" rx="2" fill="#e0e0e0"/>
  <!-- Light bar -->
  <rect x="155" y="130" width="90" height="3" rx="1.5" fill="#2196f3" opacity="0.6"/>
  <!-- Second controller hint -->
  <g transform="translate(40,300) scale(0.4)">
    <path d="M0 20 Q0 0 20 0 L60 0 Q80 0 80 20 L80 40 Q80 55 65 60 L55 62 Q50 65 45 62 L35 62 Q30 65 25 62 L15 60 Q0 55 0 40 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>
  <!-- Game discs hint -->
  <g transform="translate(290,290)">
    <circle cx="25" cy="25" r="25" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="25" cy="25" r="5" fill="rgba(255,255,255,0.1)"/>
    <text x="25" y="58" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">×3 游戏</text>
  </g>
  <!-- Label -->
  <text x="200" y="340" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="600">DualSense 手柄</text>
  <text x="200" y="360" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">双手柄 + 三款游戏</text>
  <!-- Price -->
  <rect x="145" y="375" width="110" height="22" rx="11" fill="rgba(255,255,255,0.1)"/>
  <text x="200" y="391" font-family="Arial,sans-serif" font-size="12" fill="#ffd700" text-anchor="middle" font-weight="bold">¥2,899</text>
</svg>
