<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="mbBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2c3e50"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#mbBg2)" rx="8"/>
  <circle cx="80" cy="320" r="100" fill="#667eea" opacity="0.06"/>
  <!-- MacBook side/angle view -->
  <!-- Screen (tilted) -->
  <path d="M100 80 L300 70 L295 230 L105 235 Z" fill="#1a1a2e" stroke="#555" stroke-width="1.5"/>
  <path d="M108 88 L292 78 L288 224 L112 228 Z" fill="#667eea" opacity="0.6"/>
  <!-- Screen content -->
  <rect x="125" y="100" width="140" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="125" y="115" width="100" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="125" y="128" width="120" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="125" y="148" width="80" height="50" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="215" y="148" width="60" height="22" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="215" y="176" width="60" height="22" rx="4" fill="rgba(255,255,255,0.08)"/>
  <!-- Base (perspective) -->
  <path d="M80 240 L320 230 L340 260 L60 270 Z" fill="#b0b0b0" stroke="#888" stroke-width="1"/>
  <path d="M60 270 L340 260 L350 275 L50 285 Z" fill="#a0a0a0"/>
  <!-- Hinge -->
  <rect x="95" y="233" width="210" height="3" rx="1.5" fill="#888"/>
  <!-- Keyboard area -->
  <rect x="100" y="245" width="200" height="12" rx="2" fill="#999" opacity="0.3"/>
  <!-- Decorative -->
  <circle cx="340" cy="100" r="40" fill="#764ba2" opacity="0.08"/>
  <circle cx="60" cy="100" r="25" fill="#667eea" opacity="0.1"/>
  <!-- Specs badges -->
  <rect x="60" y="310" width="70" height="24" rx="12" fill="rgba(102,126,234,0.2)"/>
  <text x="95" y="326" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">M2芯片</text>
  <rect x="140" y="310" width="70" height="24" rx="12" fill="rgba(118,75,162,0.2)"/>
  <text x="175" y="326" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">16GB</text>
  <rect x="220" y="310" width="70" height="24" rx="12" fill="rgba(102,126,234,0.2)"/>
  <text x="255" y="326" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">512GB</text>
  <!-- Label -->
  <text x="200" y="375" font-family="Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">MacBook Pro 2022</text>
</svg>
