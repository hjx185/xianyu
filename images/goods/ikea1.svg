<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f5f5f5"/>
  <!-- Desk top -->
  <rect x="60" y="140" width="280" height="15" rx="2" fill="#fff"/>
  <rect x="60" y="140" width="280" height="12" rx="2" fill="#f8f8f8"/>
  <!-- Left leg panel -->
  <rect x="70" y="155" width="40" height="160" rx="2" fill="#e8e8e8"/>
  <rect x="70" y="155" width="38" height="158" rx="2" fill="#f0f0f0"/>
  <!-- Drawer unit left -->
  <rect x="70" y="180" width="40" height="80" rx="2" fill="#e0e0e0"/>
  <rect x="75" y="185" width="30" height="20" rx="2" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <rect x="75" y="210" width="30" height="20" rx="2" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <rect x="75" y="235" width="30" height="20" rx="2" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <!-- Drawer handles -->
  <rect x="86" y="192" width="8" height="3" rx="1" fill="#bbb"/>
  <rect x="86" y="217" width="8" height="3" rx="1" fill="#bbb"/>
  <rect x="86" y="242" width="8" height="3" rx="1" fill="#bbb"/>
  <!-- Right leg panel -->
  <rect x="290" y="155" width="40" height="160" rx="2" fill="#e8e8e8"/>
  <rect x="292" y="155" width="38" height="158" rx="2" fill="#f0f0f0"/>
  <!-- Items on desk -->
  <!-- Monitor -->
  <rect x="150" y="70" width="100" height="65" rx="3" fill="#333"/>
  <rect x="155" y="75" width="90" height="52" fill="#16213e"/>
  <rect x="190" y="135" width="20" height="5" fill="#555"/>
  <rect x="180" y="140" width="40" height="3" rx="1" fill="#555"/>
  <!-- Keyboard -->
  <rect x="145" y="145" width="80" height="20" rx="3" fill="#e0e0e0"/>
  <!-- Mouse -->
  <ellipse cx="245" cy="152" rx="8" ry="12" fill="#e0e0e0"/>
  <!-- Coffee mug -->
  <rect x="270" y="125" width="15" height="18" rx="2" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <path d="M285,130 Q295,135 285,145" fill="none" stroke="#ddd" stroke-width="1.5"/>
  <!-- Dimensions -->
  <line x1="60" y1="330" x2="340" y2="330" stroke="#999" stroke-width="0.5"/>
  <text x="200" y="345" font-family="Arial" font-size="10" fill="#999" text-anchor="middle">120cm</text>
  <!-- Label -->
  <text x="200" y="370" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">宜家MALM书桌 白色</text>
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">120×60cm 8成新</text>
</svg>