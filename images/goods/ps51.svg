<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="psBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="psBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f5f5f5"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#psBg1)" rx="8"/>
  <circle cx="320" cy="80" r="80" fill="#1e88e5" opacity="0.15"/>
  <!-- PS5 console - front view -->
  <!-- Left white panel -->
  <path d="M120 80 L125 70 L200 65 L200 280 L125 275 L120 265 Z" fill="url(#psBody)" stroke="#ddd" stroke-width="1"/>
  <!-- Right white panel -->
  <path d="M200 65 L275 70 L280 80 L280 265 L275 275 L200 280 Z" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <!-- Black center strip -->
  <rect x="190" y="68" width="20" height="210" fill="#1a1a2e"/>
  <!-- Glossy finish on black strip -->
  <rect x="192" y="68" width="4" height="210" fill="rgba(255,255,255,0.05)"/>
  <!-- USB ports -->
  <rect x="195" y="100" width="10" height="4" rx="1" fill="#333"/>
  <rect x="195" y="112" width="10" height="4" rx="1" fill="#333"/>
  <!-- Disc drive slot -->
  <rect x="195" y="150" width="10" height="2" rx="1" fill="#444"/>
  <!-- PS logo -->
  <circle cx="200" cy="200" r="8" fill="none" stroke="#0d47a1" stroke-width="1.5"/>
  <!-- Power button -->
  <rect x="194" y="220" width="12" height="3" rx="1.5" fill="#0d47a1"/>
  <!-- Blue LED strip -->
  <rect x="125" y="80" width="150" height="2" fill="#2196f3" opacity="0.6"/>
  <!-- Base/stand -->
  <ellipse cx="200" cy="285" rx="80" ry="10" fill="#1a1a2e"/>
  <!-- Controller hint -->
  <g transform="translate(40,300) scale(0.5)">
    <path d="M0 20 Q0 0 20 0 L60 0 Q80 0 80 20 L80 40 Q80 55 65 60 L55 62 Q50 65 45 62 L35 62 Q30 65 25 62 L15 60 Q0 55 0 40 Z" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
    <circle cx="25" cy="25" r="5" fill="#2196f3"/>
    <circle cx="55" cy="25" r="5" fill="#f44336"/>
  </g>
  <!-- Label -->
  <text x="250" y="340" font-family="Arial,sans-serif" font-size="18" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-weight="bold">PlayStation 5</text>
  <text x="250" y="360" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">光驱版 · 双手柄</text>
  <!-- Price -->
  <rect x="195" y="375" width="110" height="22" rx="11" fill="rgba(255,255,255,0.15)"/>
  <text x="250" y="391" font-family="Arial,sans-serif" font-size="12" fill="#ffd700" text-anchor="middle" font-weight="bold">¥2,899</text>
</svg>
