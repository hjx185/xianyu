<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="jdBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#jdBg1)" rx="8"/>
  <circle cx="320" cy="80" r="80" fill="#e74c3c" opacity="0.15"/>
  <!-- Shoe body - side view -->
  <!-- Sole -->
  <path d="M80 260 L100 270 L300 270 L320 260 L310 255 L90 255 Z" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <!-- Midsole -->
  <path d="M85 255 L315 255 L310 248 L90 248 Z" fill="#e0e0e0"/>
  <!-- Upper shoe body -->
  <path d="M90 248 L100 180 Q120 140 180 130 L220 128 Q260 130 280 150 L310 200 L310 248 Z" fill="#c0392b"/>
  <!-- Toe box -->
  <path d="M90 248 L100 200 Q105 185 130 178 L160 175 L160 248 Z" fill="#e74c3c"/>
  <!-- Swoosh / Nike check -->
  <path d="M120 220 Q160 190 220 185 Q260 183 290 195" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- Ankle collar -->
  <path d="M220 128 Q240 120 260 125 L280 150 Q270 140 250 135 Q230 130 220 128" fill="#a93226"/>
  <!-- Tongue -->
  <path d="M200 130 L210 100 Q215 90 225 90 L235 92 Q240 95 238 105 L230 128" fill="#d4a574" stroke="#c09060" stroke-width="1"/>
  <!-- Lace holes -->
  <circle cx="195" cy="145" r="3" fill="#1a1a2e"/>
  <circle cx="210" cy="140" r="3" fill="#1a1a2e"/>
  <circle cx="225" cy="138" r="3" fill="#1a1a2e"/>
  <!-- Laces -->
  <line x1="195" y1="145" x2="210" y2="140" stroke="#fff" stroke-width="1.5"/>
  <line x1="210" y1="140" x2="225" y2="138" stroke="#fff" stroke-width="1.5"/>
  <!-- Wings logo -->
  <circle cx="250" cy="155" r="10" fill="none" stroke="#ffd700" stroke-width="1.5"/>
  <text x="250" y="159" font-family="Arial" font-size="8" fill="#ffd700" text-anchor="middle">23</text>
  <!-- Jumpman silhouette hint -->
  <circle cx="140" cy="200" r="8" fill="rgba(255,255,255,0.15)"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="280" rx="120" ry="8" fill="rgba(0,0,0,0.2)"/>
  <!-- Label -->
  <text x="200" y="320" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="600">Air Jordan 1</text>
  <text x="200" y="340" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">黑红脚趾 · 42码</text>
  <!-- Size badge -->
  <rect x="165" y="355" width="70" height="22" rx="11" fill="rgba(255,255,255,0.15)"/>
  <text x="200" y="370" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">US 9</text>
</svg>
