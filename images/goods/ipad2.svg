<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="ipdBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#263238"/>
      <stop offset="100%" style="stop-color:#37474f"/>
    </linearGradient>
    <linearGradient id="ipdScr2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a"/>
      <stop offset="100%" style="stop-color:#26a69a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#ipdBg2)" rx="8"/>
  <!-- iPad tilted/landscape view -->
  <rect x="60" y="100" width="280" height="180" rx="14" fill="#1a1a2e" stroke="#555" stroke-width="1.5"/>
  <rect x="68" y="108" width="264" height="164" rx="8" fill="url(#ipdScr2)"/>
  <!-- Camera -->
  <circle cx="200" cy="104" r="2" fill="#2d2d3f"/>
  <!-- Screen content - drawing app -->
  <rect x="85" y="125" width="80" height="10" rx="5" fill="rgba(255,255,255,0.25)"/>
  <!-- Canvas area -->
  <rect x="85" y="142" width="150" height="100" rx="6" fill="rgba(255,255,255,0.15)"/>
  <!-- Drawing strokes -->
  <path d="M100 170 Q120 155 140 165 Q160 175 180 160" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 190 Q130 180 150 188 Q170 195 195 185" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tools panel -->
  <rect x="245" y="125" width="70" height="120" rx="6" fill="rgba(255,255,255,0.1)"/>
  <circle cx="265" cy="145" r="8" fill="rgba(255,255,255,0.2)"/>
  <circle cx="295" cy="145" r="8" fill="rgba(255,255,255,0.15)"/>
  <circle cx="265" cy="170" r="8" fill="rgba(255,255,255,0.15)"/>
  <circle cx="295" cy="170" r="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="255" y="190" width="50" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="255" y="202" width="50" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <!-- Bottom toolbar -->
  <rect x="85" y="252" width="230" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <!-- Home indicator -->
  <rect x="180" y="265" width="40" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  <!-- Apple Pencil -->
  <rect x="345" y="90" width="6" height="120" rx="3" fill="#f5f5f5" stroke="#ddd" stroke-width="1" transform="rotate(10,348,150)"/>
  <path d="M348 90 L345 80 L351 80 Z" fill="#ccc" transform="rotate(10,348,85)"/>
  <!-- Decorative -->
  <circle cx="60" cy="350" r="40" fill="#66bb6a" opacity="0.08"/>
  <!-- Label -->
  <text x="200" y="320" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="600">iPad Air 5</text>
  <text x="200" y="340" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">搭配 Apple Pencil</text>
  <!-- Price -->
  <rect x="145" y="360" width="110" height="28" rx="14" fill="rgba(255,255,255,0.1)"/>
  <text x="200" y="379" font-family="Arial,sans-serif" font-size="14" fill="#ffd700" text-anchor="middle" font-weight="bold">¥3,299</text>
</svg>
