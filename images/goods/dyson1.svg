<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="dyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <linearGradient id="dyBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="50%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#c39bd3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#dyBg)" rx="8"/>
  <circle cx="320" cy="80" r="60" fill="#9b59b6" opacity="0.08"/>
  <!-- Main body tube -->
  <rect x="185" y="60" width="30" height="200" rx="15" fill="url(#dyBody)"/>
  <!-- Motor housing -->
  <ellipse cx="200" cy="70" rx="25" ry="18" fill="#6c3483"/>
  <ellipse cx="200" cy="65" rx="18" ry="10" fill="#7b2ff7"/>
  <!-- Cyclone assembly -->
  <rect x="175" y="85" width="50" height="60" rx="8" fill="#8e44ad" stroke="#7b2ff7" stroke-width="1.5"/>
  <!-- Cyclone rings -->
  <ellipse cx="200" cy="100" rx="20" ry="5" fill="none" stroke="#a569bd" stroke-width="1"/>
  <ellipse cx="200" cy="110" rx="18" ry="4" fill="none" stroke="#a569bd" stroke-width="1"/>
  <ellipse cx="200" cy="120" rx="16" ry="4" fill="none" stroke="#a569bd" stroke-width="1"/>
  <!-- Handle/trigger -->
  <path d="M215 140 L240 155 L245 170 L235 175 L215 160" fill="#5b2c6f" stroke="#4a235a" stroke-width="1"/>
  <rect x="230" y="158" width="18" height="8" rx="4" fill="#c39bd3"/>
  <!-- Extension tube -->
  <rect x="192" y="200" width="16" height="80" rx="8" fill="#a569bd"/>
  <!-- Floor head -->
  <rect x="140" y="275" width="120" height="30" rx="15" fill="#8e44ad" stroke="#7b2ff7" stroke-width="1.5"/>
  <!-- Brush roll indicator -->
  <rect x="155" y="285" width="90" height="8" rx="4" fill="#7b2ff7"/>
  <circle cx="170" cy="289" r="3" fill="#c39bd3"/>
  <circle cx="200" cy="289" r="3" fill="#c39bd3"/>
  <circle cx="230" cy="289" r="3" fill="#c39bd3"/>
  <!-- Connection joint -->
  <circle cx="200" cy="270" r="8" fill="#9b59b6"/>
  <circle cx="200" cy="270" r="4" fill="#7b2ff7"/>
  <!-- LED lights on body -->
  <circle cx="195" cy="95" r="2" fill="#4caf50" opacity="0.8"/>
  <!-- Battery indicator -->
  <rect x="188" y="150" width="24" height="8" rx="4" fill="#4caf50" opacity="0.6"/>
  <!-- Label -->
  <text x="200" y="340" font-family="Arial,sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="600">戴森 V12</text>
  <text x="200" y="360" font-family="Arial,sans-serif" font-size="12" fill="#999" text-anchor="middle">Detect Slim · 配件齐全</text>
  <!-- Price -->
  <rect x="145" y="375" width="110" height="22" rx="11" fill="#f3e5f5"/>
  <text x="200" y="391" font-family="Arial,sans-serif" font-size="12" fill="#7b2ff7" text-anchor="middle" font-weight="bold">¥2,199</text>
</svg>
