<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300" width="750" height="300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4db"/>
      <stop offset="50%" style="stop-color:#0083b0"/>
      <stop offset="100%" style="stop-color:#005c7a"/>
    </linearGradient>
    <linearGradient id="cloth2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="3" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="750" height="300" fill="url(#bg2)"/>
  <!-- Decorative waves -->
  <path d="M0,220 Q100,180 200,220 T400,220 T600,220 T750,220 L750,300 L0,300 Z" fill="#fff" opacity="0.06"/>
  <path d="M0,250 Q120,210 250,250 T500,250 T750,250 L750,300 L0,300 Z" fill="#fff" opacity="0.04"/>
  <!-- Sun -->
  <circle cx="620" cy="60" r="40" fill="#FFD700" opacity="0.3"/>
  <circle cx="620" cy="60" r="28" fill="#FFD700" opacity="0.5"/>
  <!-- Clouds -->
  <g opacity="0.15">
    <ellipse cx="500" cy="80" rx="35" ry="15" fill="#fff"/>
    <ellipse cx="530" cy="75" rx="25" ry="12" fill="#fff"/>
    <ellipse cx="475" cy="78" rx="20" ry="10" fill="#fff"/>
  </g>
  <!-- Clothes illustration -->
  <g filter="url(#shadow2)">
    <!-- T-shirt -->
    <path d="M560,100 L530,120 L540,140 L555,130 L555,230 L645,230 L645,130 L660,140 L670,120 L640,100 L620,110 Q600,120 580,110 Z" fill="url(#cloth2)" stroke="#e0e0e0" stroke-width="1.5"/>
    <!-- T-shirt collar -->
    <path d="M580,110 Q590,125 600,128 Q610,125 620,110" fill="none" stroke="#ddd" stroke-width="1.5"/>
    <!-- Pattern on shirt -->
    <circle cx="600" cy="170" r="20" fill="none" stroke="#00b4db" stroke-width="2" opacity="0.4"/>
    <text x="600" y="175" font-family="Arial" font-size="12" fill="#00b4db" text-anchor="middle" opacity="0.5">☀</text>
  </g>
  <!-- Price tags -->
  <g>
    <rect x="545" y="240" width="110" height="30" rx="6" fill="#FFD700" opacity="0.9"/>
    <text x="600" y="260" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">低至 ¥39</text>
  </g>
  <!-- Text -->
  <text x="60" y="105" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="44" font-weight="bold" fill="#fff">夏日焕新</text>
  <text x="60" y="148" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#fff" opacity="0.9">服饰鞋包 · 焕新一夏</text>
  <text x="60" y="180" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#fff" opacity="0.7">潮流好物 · 品质二手 · 超值特卖</text>
  <!-- CTA button -->
  <rect x="60" y="205" width="140" height="42" rx="21" fill="#fff"/>
  <text x="130" y="232" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="bold" fill="#0083b0" text-anchor="middle">去看看</text>
</svg>